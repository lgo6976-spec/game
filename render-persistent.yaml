services:
  - type: web
    name: bamnolja-party-game
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -c "import content_pack_v3, server"
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: ROOM_TTL_SECONDS
        value: "43200"
      - key: STATE_FILE
        value: "/var/data/rooms_state.json"
    disk:
      name: bamnolja-state
      mountPath: /var/data
      sizeGB: 1
